# The arm's joint trajectory controller, loaded into the Husky's controller manager by start-sim.
/**:
  arm_0_joint_trajectory_controller:
    ros__parameters:
      joints:
        - arm_0_joint_1
        - arm_0_joint_2
        - arm_0_joint_3
        - arm_0_joint_4
        - arm_0_joint_5
        - arm_0_joint_6
      command_interfaces: [position]
      state_interfaces: [position, velocity]
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.0
        goal_time: 0.0
