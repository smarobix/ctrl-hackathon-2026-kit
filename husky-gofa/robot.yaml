# Clearpath configuration: a Husky A200 with bumpers and a top plate, as in Clearpath's
# a200 samples. Clearpath's tools have no ABB arm, so the GoFa comes in as a URDF extra;
# its controller and MoveIt are started by start-sim.
serial_number: a200-0000
version: 0
system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000
platform:
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
  extras:
    urdf:
      path: /opt/kit/urdf/gofa_on_husky.urdf.xacro
